# Builds and (on main/tags, not PRs) publishes each service's image to GHCR.
# Uses the repo's own built-in GITHUB_TOKEN — no extra secret needed, unlike
# release.yml's signing secrets.
name: Docker images

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'signal-server/**'
      - 'site/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'signal-server/**'
      - 'site/**'
      - '.github/workflows/docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: signal-server
            image: wewe-signal-server
          - context: site
            image: wewe-site
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # PRs build (catches a broken Dockerfile before merge) but never push —
      # no registry credentials are available on a fork's pull_request event.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
