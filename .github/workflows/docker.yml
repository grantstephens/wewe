# Builds and (on main/tags, not PRs) publishes the signal-server image to
# GHCR. Uses the repo's own built-in GITHUB_TOKEN — no extra secret needed,
# unlike release.yml's signing secrets.
name: Docker (signal-server)

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'signal-server/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'signal-server/**'
      - '.github/workflows/docker.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wewe-signal-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # PRs build (catches a broken Dockerfile before merge) but never push —
      # no registry credentials are available on a fork's pull_request event.
      - uses: docker/build-push-action@v6
        with:
          context: signal-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
