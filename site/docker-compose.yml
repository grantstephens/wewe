# Static site (marketing + privacy policy) — see signal-server/docker-compose.yml
# for why this binds to all interfaces rather than 127.0.0.1: a reverse
# proxy on a different host/container needs to reach it.
services:
  site:
    image: ghcr.io/grantstephens/wewe-site:latest
    build: .
    restart: unless-stopped
    ports:
      - "8788:80"
