# Minimal — no TLS here; point your own existing reverse proxy at this
# host's :8787. Bound to all interfaces, not just localhost, since a
# reverse proxy commonly runs on a separate host/container from whatever's
# running this compose file (e.g. a dedicated Nginx Proxy Manager box) — a
# 127.0.0.1-only bind is unreachable from anywhere else on the network,
# confirmed by a real deployment where that produced a hard connection
# refused from the proxy host. If your proxy genuinely runs on this same
# host, both work equally; if not, only this one does. See README.md
# "Self-hostable" for the wire protocol and why this service is stateless.
services:
  signal-server:
    image: ghcr.io/grantstephens/wewe-signal-server:latest
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787

    # Uncomment for the label style your reverse proxy expects, so it picks
    # this container up automatically instead of a manual port mapping.
    #
    # Traefik:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.wewe-signal.rule=Host(`wewe-api.hub13.xyz`)
    #   - traefik.http.routers.wewe-signal.tls.certresolver=letsencrypt
    #   - traefik.http.services.wewe-signal.loadbalancer.server.port=8787
    #
    # Caddy (lucaslorentz/caddy-docker-proxy):
    # labels:
    #   caddy: wewe-api.hub13.xyz
    #   caddy.reverse_proxy: "{{upstreams 8787}}"
