# Draft F-Droid recipe for wewe, kept in-repo the same way ReminDiary keeps
# its own annotated copy (fdroid/xyz.hub13.remindiary.yml) in sync with what
# it actually pushed to fdroiddata. UNLIKE that file, this one has not been
# submitted as an MR against https://gitlab.com/fdroid/fdroiddata yet — there
# is no tagged wewe release for a Builds: entry to point at, and F-Droid
# review expects a real, already-buildable commit, not a placeholder.
#
# Before submitting:
#   1. Cut a real tagged release (`make prepare-release TAG=v1.0.0 ...`,
#      then `git tag`/`git push` — see README.md "Releasing").
#   2. Replace the TODOs below with that tag's actual commit hash,
#      versionName, and versionCode (from fdroid-version.txt).
#   3. Try a local `fdroid build` (or push this file and let fdroiddata's own
#      CI attempt it) and fix whatever the real build turns up — do not
#      assume this works untested. In particular:
#        - buildFromSource: [".*"] (F-Droid's no-prebuilt-binaries policy)
#          has not been verified against react-native-webrtc, which carries
#          real native/C++ surface ReminDiary's pure-JS dependency tree
#          doesn't have — this is the most likely thing to need iteration.
#        - No reproducible-build (Binaries:/AllowedAPKSigningKeys) hardening
#          yet, unlike ReminDiary's recipe — add that only once there is a
#          real release to diff a from-source build against, the same way
#          ReminDiary's own reproducibility work happened after v1.0.1, not
#          before it.
#   4. Only then open the fdroiddata MR.
#
# Categories is a guess (this streams live audio, so "Multimedia" over
# "Connectivity") — expect a reviewer to redirect it, as happened with
# ReminDiary's Note/Writing categorization.
Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: Grant Stephens
AuthorEmail: grant@stephens.co.za
AuthorWebSite: https://grant.stephens.co.za
SourceCode: https://github.com/grantstephens/wewe
IssueTracker: https://github.com/grantstephens/wewe/issues
Changelog: https://github.com/grantstephens/wewe/releases

AutoName: Wewe

RepoType: git
Repo: https://github.com/grantstephens/wewe.git

Builds:
  - versionName: TODO # e.g. 1.0.0, from fdroid-version.txt after tagging
    versionCode: TODO # from fdroid-version.txt after tagging
    commit: TODO # full commit hash the tag points at, not the tag name
    sudo:
      - echo "deb http://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - npm ci --legacy-peer-deps
    prebuild:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      # $$VERSION$$/$$VERCODE$$ are real fdroidserver placeholders
      # (common.py's replace_build_vars()), substituted at build time from
      # this Builds entry's own top-level fields.
      - sed -i -e '/"version"/s/1.0.0/$$VERSION$$/' -e '/"android":\ {/a "versionCode":$$VERCODE$$,'
        app.json
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - npx expo prebuild --platform android --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    build:
      - cd android/app
      - gradle assembleRelease
    scandelete:
      - node_modules/
    output: android/app/build/outputs/apk/release/*.apk

# UpdateCheckMode: Tags + UpdateCheckData mirrors ReminDiary's own recipe —
# see that file's comments for the full reasoning (android/ is generated by
# `expo prebuild` and never committed, so `checkupdates`' default
# committed-AndroidManifest.xml lookup can't work here). `make prepare-release`
# is what writes fdroid-version.txt before each tag; do that before the first
# tag too, not just later ones.
AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=(.+)
CurrentVersion: TODO
CurrentVersionCode: TODO
