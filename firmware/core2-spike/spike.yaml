esphome:
  name: wewe

esp32:
  board: m5stack-core2
  framework:
    type: esp-idf

# Core2 has 8MB Quad PSRAM (per M5Stack's own spec) — mipi_spi's M5CORE2
# model needs it for its framebuffer.
psram:
  mode: quad

external_components:
  - source:
      type: local
      path: components
  - source:
      type: local
      path: ../wewe_monitor

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22

# Powers the display + touch controller's rails — both are dark/absent
# from the I2C bus without this (confirmed on real hardware: the FT6336U
# touch chip doesn't even show up in an I2C scan until this runs).
wewe_axp192:
  id: axp192
  i2c_id: bus_a

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

font:
  # Roboto is what the app itself renders with (react-native-paper's MD3
  # default on Android is the system Roboto face — no custom font is
  # bundled) — matching it here, not swapping in a different family.
  # Weight varies like the app's MD3 type scale: Medium for headline/label
  # text, Regular for body — a single flat weight is what read "demo".
  - file: "gfonts://Roboto@medium"
    id: font_large
    size: 48
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
  - file: "gfonts://Roboto@medium"
    id: font_label
    size: 20

time:
  - platform: sntp
    id: sntp_time

display:
  - platform: mipi_spi
    model: M5CORE2
    id: core2_display
    update_interval: 1s
    lambda: |-
      // Screen-off/on tracks the AXP192 backlight rail too, not just what
      // gets drawn — toggled once per is_screen_on() transition (checked
      // at this 1s render cadence) rather than every frame, since it's a
      // real I2C write. See wewe_axp192.h's set_backlight() doc comment
      // for why register 0x12 bit 1 specifically.
      static bool screen_was_on = true;
      bool screen_on_now = id(wewe).is_screen_on();
      if (screen_on_now != screen_was_on) {
        id(axp192).set_backlight(screen_on_now);
        screen_was_on = screen_on_now;
      }

      // Brand colors, not black-and-white — #1A2140 is the app's own seed
      // color (src/theme.ts, also app.json's splash background), so this
      // reads as *this app* instead of a generic ESPHome demo. "Surface"
      // is Material-dark-theme naming: one shade up from the background,
      // used for anything that should read as a raised panel (the header
      // bar, the status card) instead of flat on the background.
      const Color BG = Color(0x1A, 0x21, 0x40);
      const Color SURFACE = Color(0x23, 0x2B, 0x52);
      const Color MUTED = Color(0xA0, 0xA6, 0xC0);
      const Color DIM = Color(0x70, 0x76, 0x94);

      // No rounded-rect primitive in ESPHome's Display API — faked with a
      // cross of two rectangles plus 4 corner circles. Reused for both the
      // status card and the pill button (r = h/2 there).
      auto rounded_rect = [&it](int x, int y, int w, int h, int r, Color c) {
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_rectangle(x, y + r, w, h - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
        it.filled_circle(x + r, y + h - r - 1, r, c);
        it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
      };

      it.fill(BG);
      if (!screen_on_now) {
        // Screen-off: nothing else drawn — see wake_touch_area below for
        // how it comes back.
        return;
      }

      // Header bar, two lines: device name + battery, then WiFi dot +
      // network name + signal bars. Flat (unrounded, flush to the screen
      // edge) — the SURFACE/BG color change alone reads as a raised app
      // bar without needing a stroke under it.
      it.filled_rectangle(0, 0, 320, 44, SURFACE);
      it.printf(8, 4, id(font_label), Color::WHITE, TextAlign::TOP_LEFT, "%s", App.get_name().c_str());
      if (id(axp192).has_battery()) {
        int batt_pct = id(axp192).get_battery_percent();
        if (batt_pct >= 0) {
          char batt_buf[16];
          snprintf(batt_buf, sizeof(batt_buf), "%d%%%s", batt_pct, id(axp192).is_charging() ? " chg" : "");
          it.printf(200, 4, id(font_label), Color::WHITE, TextAlign::TOP_RIGHT, "%s", batt_buf);
        }
      }
      auto now = id(sntp_time).now();
      if (now.is_valid()) {
        it.printf(312, 4, id(font_label), Color::WHITE, TextAlign::TOP_RIGHT, "%s",
                  now.strftime("%H:%M").c_str());
      }

      bool wifi_ok = id(wifi_comp).is_connected();
      it.filled_circle(12, 32, 4, wifi_ok ? Color(0x30, 0xC0, 0x50) : Color(0x60, 0x60, 0x60));

      // wifi_ssid_to() can return raw UTF-8 (real, reproduced: a "🤖 IoT"
      // SSID spammed "Codepoint not found" every redraw and blew the
      // display's render-time budget hunting for a glyph Roboto doesn't
      // have). Sanitize to what the font can actually draw rather than
      // trying to render it — same lesson as everywhere else in this file:
      // don't guess, don't half-fix, fix what's actually happening.
      char ssid_buf[wifi::SSID_BUFFER_SIZE];
      const char *ssid_raw = id(wifi_comp).wifi_ssid_to(ssid_buf);
      char ssid_clean[wifi::SSID_BUFFER_SIZE];
      {
        size_t j = 0;
        bool seen_non_space = false;
        for (size_t i = 0; ssid_raw[i] != '\0' && j < sizeof(ssid_clean) - 1; i++) {
          unsigned char c = (unsigned char) ssid_raw[i];
          if (c < 0x20 || c > 0x7e) {
            continue;  // drop non-ASCII (emoji, accents, etc.) — no tofu glyphs
          }
          if (c == ' ' && !seen_non_space) {
            continue;  // trim what dropped-emoji leaves as a leading space
          }
          seen_non_space = true;
          ssid_clean[j++] = (char) c;
        }
        ssid_clean[j] = '\0';
      }
      const char *ssid_display = ssid_clean[0] != '\0' ? ssid_clean : "(network)";
      it.printf(22, 24, id(font_small), MUTED, TextAlign::TOP_LEFT, "%s",
                wifi_ok ? ssid_display : "Not connected");

      if (wifi_ok) {
        int8_t rssi = id(wifi_comp).wifi_rssi();
        int bars = rssi >= -55 ? 4 : rssi >= -65 ? 3 : rssi >= -75 ? 2 : rssi >= -85 ? 1 : 0;
        for (int b = 0; b < 4; b++) {
          int bar_h = 4 + b * 4;
          it.filled_rectangle(280 + b * 8, 40 - bar_h, 5, bar_h, b < bars ? Color::WHITE : Color(0x3A, 0x42, 0x66));
        }
      }

      // Status card: a raised panel floating on the background, not text
      // flat on black — this plus the header recolor is most of what
      // actually kills the "2000s LCD" look.
      int connected = id(wewe).connected_listener_count();
      std::string code = id(wewe).current_code();
      rounded_rect(16, 52, 288, 114, 14, SURFACE);
      if (connected > 0) {
        // A slow pulse (this display only redraws once a second, so it's
        // not a crisp blink) — a static "N listening" read like a stuck
        // demo, not a live connection.
        bool pulse_on = (millis() / 600) % 2 == 0;
        it.filled_circle(160, 78, 4, pulse_on ? Color(0x30, 0xC0, 0x50) : Color(0x1E, 0x54, 0x34));
        char buf[32];
        snprintf(buf, sizeof(buf), "%d listening", connected);
        it.printf(160, 112, id(font_large), Color::WHITE, TextAlign::CENTER, "%s", buf);
      } else if (!code.empty()) {
        int secs = id(wewe).seconds_remaining();
        it.printf(160, 92, id(font_large), Color::WHITE, TextAlign::CENTER, "%s", code.c_str());
        char buf[16];
        snprintf(buf, sizeof(buf), "%ds left", secs);
        it.printf(160, 132, id(font_small), MUTED, TextAlign::CENTER, "%s", buf);
      } else {
        it.printf(160, 100, id(font_small), MUTED, TextAlign::CENTER, "Monitoring nursery");
      }

      // Last-sound line, always shown near the card's bottom edge.
      int since = id(wewe).seconds_since_last_sound();
      char sound_buf[32];
      if (since < 0) {
        snprintf(sound_buf, sizeof(sound_buf), "No sound detected yet");
      } else if (since < 60) {
        snprintf(sound_buf, sizeof(sound_buf), "Last sound: %ds ago", since);
      } else {
        snprintf(sound_buf, sizeof(sound_buf), "Last sound: %dm ago", since / 60);
      }
      it.printf(160, 150, id(font_small), DIM, TextAlign::CENTER, "%s", sound_buf);

      // Bottom: a pill-shaped, state-colored button — its drawn rect here
      // must match the touchscreen binary_sensor's x_min/x_max/y_min/y_max
      // below. Color carries the state (blue=idle, amber=code waiting,
      // green=live) instead of every state looking the same.
      Color button_color = connected > 0 ? Color(0x2E, 0xB0, 0x63)
                            : !code.empty() ? Color(0xD9, 0x9A, 0x2E)
                                             : Color(0x3D, 0x5A, 0xE0);
      rounded_rect(70, 182, 180, 42, 21, button_color);
      it.printf(160, 203, id(font_label), Color::WHITE, TextAlign::CENTER, "%s",
                (connected > 0 || !code.empty()) ? "New Code" : "Tap to Pair");

touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39

binary_sensor:
  # Whole-screen — every tap keeps the screen awake / wakes it from off.
  # Always registered first so a tap that both wakes the screen and lands
  # in the button below is recognized as "just a wake" by on_pair_tapped()
  # (see wewe_monitor.cpp's pending_wake_only for how the race is
  # handled — order between these two on_press callbacks isn't relied on).
  - platform: touchscreen
    id: wake_touch_area
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
    on_press:
      - lambda: id(wewe).on_screen_touched();
  # Bounded to the drawn pill button above — matches its rect exactly
  # (x:70-250, y:182-224).
  - platform: touchscreen
    id: pair_touch_area
    x_min: 70
    x_max: 250
    y_min: 182
    y_max: 224
    on_press:
      - lambda: id(wewe).on_pair_tapped();

wewe_monitor:
  id: wewe
  signal_url: "wss://wewe-api.hub13.xyz"
  clk_pin: GPIO0
  din_pin: GPIO34

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

network:
  enable_ipv6: true

logger:
